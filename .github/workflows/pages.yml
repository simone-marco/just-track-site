# Pubblica src/ su GitHub Pages a ogni push su main. Il dominio just-track.it si imposta nelle
# impostazioni Pages del repository: con il deploy da Actions il file CNAME non serve.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; quello in corso arriva in fondo invece di essere annullato
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: src

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
